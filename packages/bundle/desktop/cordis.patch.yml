# The dsh-desktop bundle patch: the desktop surface over the dsh-web-app
# layer. Applied after dsh-web-app's insert; rows here override that bundle's
# rows by id. The desktop carrier swaps the HTTP/WS transport for the
# Electron in-process IPC bridge: the transport-only rows (webserver,
# web-runtime, web-startup, client-hmr) disable, the connection row mounts
# transport-free (its browser half must stay in the boot graph), the desktop
# runtime and startup rows mount, and the whole browser roster stays exactly
# as the Web surface composed it (same ids, same packages). The adaptive
# directory picker disables in favor of the desktop runtime's Electron
# chooser (ctx.directoryPicker is provided by the desktop-app row itself),
# with the native surface pinned so ui-workspace's directory flow still has
# its hole occupant.

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: web-startup
  disabled: true

# The desktop carrier replaces the /api route and WebSocket downlinks the
# connection node half binds, so the row mounts with no injects and an empty
# trust list; it must stay ENABLED because its browser half is the boot-graph
# row that provides ctx.connection in the renderer.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: []
  config:
    trustedHosts: []

- id: client-hmr
  disabled: true

# Resolves its interaction from the webserver bind (disabled here); the
# desktop-app row registers the directoryPicker service instead.
- id: directory-picker
  disabled: true

- insert:
    - id: desktop-startup
      name: '@deepseek-ai/dsh-desktop-app/startup'

    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
      inject: [desktopRuntime]
      config:
        surfaceContext: true

    # Pinned native surface (the web row's auto mount resolves from the
    # webserver bind and cannot run here).
    - id: directory-picker-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: plugin-install
      name: '@sjhmars/plugin-install'
      config:
        profile: desktop
